 <div class="section">2. เลือกรูปแบบทัวร์</div><div class="card"><div class="split"><div><div class="itemtitle">${r.emoji} ${E(r.name)}</div><div class="itemsub">${r.days} วัน • ${r.country}</div></div>${badge(isAgent?'ตัวแทนขาย':'ทัวร์บริษัท','navy')}</div><div class="line"></div><div class="itemtitle" style="margin-bottom:7px">🏨 ที่พัก</div><div class="optiongrid">${safeSelect('hotel',Object.entries(HOTELS).map(([id,x])=>[id,x.name,x.desc]),p.hotel)}</div><div class="itemtitle" style="margin:16px 0 7px">🚌 การเดินทาง</div><div class="optiongrid">${safeSelect('transport',Object.entries(TRANSPORT).map(([id,x])=>[id,x.name,`สูงสุด ${x.cap} ที่`]),p.transport)}</div><div class="itemtitle" style="margin:16px 0 7px">🍱 อาหาร</div><div class="optiongrid">${safeSelect('meals',Object.entries(MEALS).map(([id,x])=>[id,x.name,x.extra?`เพิ่ม ${baht(x.extra)} / วัน`:'รวมในแพ็กเกจ']),p.meals)}</div><div class="itemtitle" style="margin:16px 0 8px">👥 จำนวนที่นั่งที่ต้องการ</div><div class="pills">${[8,12,16,20,24].map(v=>`<button class="pick slim ${p.seats===v?'active':''}" data-act="setseats" data-value="${v}">${v} คน</button>`).join('')}</div><div class="note" style="margin-top:11px">รับลูกค้าได้จริงสูงสุด <b>${m.seatLimit} คน</b> ขึ้นกับรถ ขนาดทีม และออฟฟิศ${!s.registered?' (ตัวแทนสูงสุด 12 คน)':''}</div></div>
 <div class="section">3. จัดแผนเที่ยวรายวัน <small>เลือกได้ 2 กิจกรรม/วัน</small></div><div class="card"><p class="itemsub">ทุกกิจกรรมมีต้นทุนและเพิ่มคุณภาพทริป เลือกให้เหมาะกับกลุ่มลูกค้า</p>${Array.from({length:r.days},(_,i)=>i+1).map(d=>`<div class="day"><div class="dayhead"><div class="itemtitle">📅 วันที่ ${d} / ${r.days}</div>${badge(`${(p.activities[d]||[]).length}/2 กิจกรรม`,(p.activities[d]||[]).length===2?'ok':'')}</div><div class="stopgrid">${getStops(r).map(([emoji,name,cost],id)=>{const active=(p.activities[d]||[]).includes(id);return `<button class="stop ${active?'active':''}" data-act="stop" data-day="${d}" data-id="${id}" aria-pressed="${active}" ${!active&&(p.activities[d]||[]).length>=2?'disabled':''}><strong>${emoji} ${E(name)} ${active?'✓':''}</strong><span>${baht(cost)} / คน</span></button>`}).join('')}</div></div>`).join('')}<div class="hint">จัดกิจกรรมครบทุกวันช่วยเพิ่มความประทับใจ แต่ต้องบริหารต้นทุนด้วย</div></div>
 <div class="section">4. ตั้งราคาขายและวิเคราะห์กำไร</div><div class="card"><div class="field"><label for="tourPrice">💳 ราคาขายต่อคน (บาท)</label><div class="split"><button class="btn sec" data-act="priceStep" data-value="-200">−200</button><input id="tourPrice" style="text-align:center;flex:1;width:50%;font-size:19px;font-weight:800" type="number" inputmode="numeric" min="500" max="300000" step="100" value="${p.price}" data-change="price"><button class="btn sec" data-act="priceStep" data-value="200">+200</button></div></div><div class="grid2"><div class="tile"><div class="label">ราคาขายหลังโปร</div><div class="value">${baht(m.effectivePrice)}</div></div><div class="tile"><div class="label">ต้นทุนต่อคน</div><div class="value">${baht(m.variable)}</div></div></div><div class="line"></div>${s.registered?`<div class="metric"><span>ต้นทุนรถ/ทริป (ถ้ามีคนจอง)</span><span>${baht(m.fixed)}</span></div><div class="metric"><span>ต้นทุนรายสัปดาห์ + โฆษณา</span><span>${baht(m.wageTotal)}</span></div><div class="metric"><span>จุดคุ้มทุน</span><span>${Number.isFinite(m.breakEven)?num(m.breakEven)+' คน':'ราคาไม่พอต้นทุน'}</span></div>`:`<div class="metric"><span>คอมมิชชันที่ได้รับต่อคน</span><span>${baht(m.commission)}</span></div><div class="metric"><span>งบโฆษณา/สัปดาห์</span><span>${baht(s.market.budget)}</span></div><div class="note" style="margin:10px 0">🎫 ระหว่างเป็นตัวแทน คุณรับค่าคอมมิชชันจากผู้จัดทัวร์พันธมิตร ยังไม่แบกรับต้นทุนโรงแรม รถและกิจกรรมเอง</div>`}<div class="metric"><span>คะแนนคุณภาพทัวร์ (ประมาณ)</span><span>${m.q}/100</span></div><div class="metric"><span>คาดการณ์ลูกค้าจอง</span><span>${m.minBookings}–${m.maxBookings} คน</span></div><div class="kpi" style="margin-top:9px"><div class="itemsub">กำไรคาดการณ์ / สัปดาห์ (ณ ${m.bookings} คน)</div><div class="bigprofit ${m.profitAt(m.bookings)<0?'negative':'positive'}">${baht(m.profitAt(m.bookings))}</div><div class="hint">เป็นการประมาณ ไม่ใช่กำไรการันตี ราคาคู่แข่งและเหตุการณ์สุ่มเปลี่ยนผลได้</div></div></div>`}
function marketingView(){const m=costOf();return `<div class="card hero"><div class="eyebrow">MARKETING & RIVALS</div><div class="title">📣 หาลูกค้าและสู้คู่แข่ง</div><p class="subtitle">เลือกรูปแบบโฆษณา งบประมาณ กลุ่มเป้าหมาย และโปรโมชัน ก่อนจำลองยอดขาย</p></div><div class="section">1. ช่องทางโฆษณา</div><div class="card"><div class="optiongrid">${Object.entries(MKT).map(([id,x])=>`<button class="choice ${s.market.channel===id?'active':''}" data-act="setmarket" data-key="channel" data-value="${id}"><b>${x.emoji} ${x.name}</b><small>${x.desc}</small></button>`).join('')}</div></div><div class="section">2. งบโฆษณาต่อสัปดาห์</div><div class="card"><div class="pills">${[0,500,1000,2000,4000,8000,15000].map(v=>`<button class="pick slim ${s.market.budget===v?'active':''}" data-act="setmarket" data-key="budget" data-value="${v}">${baht(v)}</button>`).join('')}</div><div class="note" style="margin-top:12px">💡 โฆษณาจ่ายเมื่อกดจำลอง 1 สัปดาห์เท่านั้น • งบสูงเพิ่มโอกาสขาย แต่ทำให้ต้นทุนสูงขึ้น</div></div><div class="section">3. กลุ่มลูกค้าเป้าหมาย</div><div class="card"><div class="pills">${Object.entries(AUD).map(([id,x])=>`<button class="pick slim ${s.market.audience===id?'active':''}" data-act="setmarket" data-key="audience" data-value="${id}">${x.name}</button>`).join('')}</div><div class="hint">จับกลุ่มให้ตรงประเภททัวร์เพื่อเพิ่มยอดจอง เช่น ทะเลเหมาะกับกลุ่มวัยรุ่น</div></div><div class="section">4. โปรโมชัน</div><div class="card"><div class="optiongrid">${Object.entries(OFFER).map(([id,x])=>`<button class="choice ${s.market.offer===id?'active':''}" data-act="setmarket" data-key="offer" data-value="${id}"><b>🎁 ${x.name}</b><small>${x.desc}</small></button>`).join('')}</div></div><div class="section">🏁 เปรียบเทียบคู่แข่ง</div><div class="card"><div class="itemsub" style="margin-bottom:11px">ราคาอ้างอิงเส้นทาง ${E(route().name)} (จำลองบริษัทคู่แข่ง)</div>${m.competitors.map(c=>`<div class="split" style="margin:11px 0"><div><div class="itemtitle">${c.emoji} ${E(c.name)}</div><div class="tiny muted">${E(c.style)}</div></div><div class="price">${baht(c.price)}</div></div>`).join('')}<div class="line"></div><div class="metric"><span>ราคาเสนอของคุณหลังโปร</span><span>${baht(m.effectivePrice)}</span></div>${badge(m.effectivePrice<m.bestRival?'คุณราคาถูกกว่าคู่แข่งหลัก':m.effectivePrice>m.bestRival?'คุณราคาสูงกว่าคู่แข่งหลัก':'ราคาใกล้เคียง','navy')}<div class="hint">${season().emoji} ตอนนี้เป็น${season().name}ในเกม (เปลี่ยนทุก 4 สัปดาห์) • คู่แข่งจะปรับราคาในแต่ละสัปดาห์ การเพิ่มคุณภาพทัวร์ช่วยแข่งขันกับราคาที่สูงกว่าได้</div></div><div class="section">🔭 ประเมินแคมเปญ</div><div class="card"><div class="grid2"><div class="tile"><div class="label">ยอดจองประมาณ</div><div class="value">${m.minBookings}–${m.maxBookings}</div></div><div class="tile"><div class="label">กำไรที่คาดไว้</div><div class="value ${m.profitAt(m.bookings)<0?'negative':'positive'}">${baht(m.profitAt(m.bookings))}</div></div></div><div class="note ${m.profitAt(m.bookings)<0?'warn':'ok'}" style="margin-top:10px">${m.profitAt(m.bookings)<0?'ผลคาดการณ์ขาดทุน ลองลดค่าโฆษณาหรือปรับราคาขาย':'แผนนี้มีโอกาสทำกำไร ลองกดจำลองสัปดาห์ด้านล่าง'}</div></div>`}
function operationsView(){const sub=[['office','🏢 บริษัท'],['team','👥 ทีมงาน'],['partners','🤝 คู่ค้า']];const staffCount=Object.values(s.staff).reduce((a,b)=>a+b,0);const staffLimit=2+s.office*4;const companyReady=s.cash>=30000&&s.reputation>=20&&s.customers>=25;const abroadReady=s.registered&&s.cash>=85000&&s.toursDone>=8&&s.creator.xp>=220;
let body='';if(opsTab==='office'){body=`<div class="card"><div class="field"><label for="companyName">🏷️ ชื่อบริษัททัวร์ของคุณ</label><input data-change="company" id="companyName" maxlength="40" value="${E(s.company)}" autocomplete="off"></div><div class="note">กติกาการจดทะเบียนและราคาค่าใบอนุญาตต่อไปนี้เป็น <b>ระบบสมมติในเกม</b> ไม่ใช่ขั้นตอนทางกฎหมายจริง</div></div>
 <div class="section">🏛️ สิทธิ์ประกอบธุรกิจ</div><div class="card"><div class="split"><div><div class="itemtitle">🇹🇭 บริษัทนำเที่ยวในประเทศ</div><div class="itemsub">เปิดเส้นทางใหม่และรับรายได้จากทัวร์ที่จัดเอง</div></div>${badge(s.registered?'เปิดแล้ว':'ยังไม่เปิด',s.registered?'ok':'warn')}</div><div class="hint">ต้องมี: เงินสด 30,000 ฿ • ชื่อเสียง 20 • ลูกค้า 25 คน</div>${!s.registered?`<button class="btn green full" style="margin-top:9px" data-act="register" ${!companyReady?'disabled':''}>🏢 เปิดบริษัทในเกม • ${baht(12000)}</button>`:''}<div class="line"></div><div class="split"><div><div class="itemtitle">🌐 ใบอนุญาตทัวร์ต่างประเทศ</div><div class="itemsub">ปลดล็อกญี่ปุ่น เวียดนาม เกาหลี ยุโรป</div></div>${badge(s.international?'เปิดแล้ว':'ล็อกอยู่',s.international?'ok':'warn')}</div><div class="hint">ต้องมี: บริษัทในประเทศ • เงินสด 85,000 ฿ • จัดทัวร์เอง 8 ครั้ง • 220 XP</div>${!s.international?`<button class="btn sec full" style="margin-top:9px" data-act="international" ${!abroadReady?'disabled':''}>🌏 อัปเกรดสิทธิ์ • ${baht(35000)}</button>`:''}</div>
 <div class="section">🏢 อัปเกรดสำนักงาน</div><div class="card"><div class="spread"><div><div class="itemtitle">${['ทำงานจากบ้าน','ออฟฟิศชั้นเดียว','บริษัทขนาดกลาง','สำนักงานใหญ่','สำนักงานใหญ่ระดับโลก'][s.office]}</div><div class="itemsub">LV.${s.office} • รองรับพนักงาน ${staffLimit} คน</div></div>${badge('ค่าใช้จ่าย '+baht(s.office*850)+'/สัปดาห์','navy')}</div><div class="progress" style="margin:11px 0 12px"><i style="width:${pct(s.office/4*100)}"></i></div>${s.office<4?`<button class="btn sec full" data-act="office" ${!s.registered||s.cash<[9500,22000,48000,110000][s.office]?'disabled':''}>อัปเกรดไป LV.${s.office+1} • ${baht([9500,22000,48000,110000][s.office])}</button>`:badge('ออฟฟิศสูงสุดแล้ว','ok')}<div class="hint">อัปเกรดช่วยขยายขนาดทีมและเพิ่มกำลังรับลูกค้า แต่มีค่าใช้จ่ายประจำเพิ่ม</div></div><div class="section">📍 เปิดสาขาตามภูมิภาค</div><div class="card"><div class="itemsub">ขยายสำนักงานไปยังพื้นที่ท่องเที่ยวสำคัญ เพื่อเพิ่มโอกาสขายทัวร์ในโซนนั้น แต่ต้องจ่ายค่าดำเนินการรายสัปดาห์</div>${Object.entries(BRANCHES).map(([id,b])=>`<div class="trip"><div class="flag">${b.emoji}</div><div><div class="itemtitle">${b.name}</div><div class="itemsub">${b.benefit} • ค่าใช้จ่าย ${baht(b.weekly)}/สัปดาห์</div></div>${s.branches.includes(id)?badge('เปิดแล้ว','ok'):`<button class="btn sec sm" data-act="branch" data-id="${id}" ${!s.registered||(id==='abroad'&&!s.international)||s.cash<b.cost?'disabled':''}>${baht(b.cost)}</button>`}</div>`).join('')}</div>`;}
if(opsTab==='team'){body=`<div class="card"><div class="itemtitle">👥 ทีมงาน ${staffCount}/${staffLimit} คน</div><div class="itemsub">พนักงานเพิ่มยอดขาย คุณภาพ และความจุ แต่มีเงินเดือนทุกสัปดาห์</div><div class="progress" style="margin-top:9px"><i style="width:${pct(staffCount/staffLimit*100)}"></i></div></div>${Object.entries(STAFF).map(([id,x])=>{const count=s.staff[id],lvl=s.training[id],cost=x.cost,trainCost=2500+lvl*2200;const canHire=s.registered&&s.cash>=cost&&staffCount<staffLimit&&count<6;const canTrain=count>0&&lvl<3&&s.cash>=trainCost;return `<div class="card"><div class="split"><div><div class="itemtitle">${x.emoji} ${x.name} ${count} คน</div><div class="itemsub">${x.benefit}</div></div>${badge(`ฝึก LV.${lvl}`,lvl>0?'ok':'')}</div><div class="metric"><span>เงินเดือนต่อคน / สัปดาห์</span><span>${baht(x.salary)}</span></div><div class="metric"><span>ค่าจ้างครั้งเดียว</span><span>${baht(cost)}</span></div><div class="pills" style="margin-top:10px"><button class="btn green sm" data-act="hire" data-id="${id}" ${!canHire?'disabled':''}>+ จ้าง ${baht(cost)}</button><button class="btn sec sm" data-act="train" data-id="${id}" ${!canTrain?'disabled':''}>🎓 ฝึก ${lvl}/3 • ${baht(trainCost)}</button>${count?`<button class="btn danger sm" data-act="fire" data-id="${id}">− ปลด 1 คน</button>`:''}</div></div>`}).join('')}<div class="note warn">⚠️ ต้องเปิดบริษัทก่อนจ้างพนักงาน และเมื่อมีพนักงานต้องเตรียมเงินเดือนรายสัปดาห์</div>`;}
if(opsTab==='partners'){body=`<div class="card"><div class="itemtitle">🤝 ทำสัญญาพันธมิตร</div><p class="itemsub">ต่อรองกับโรงแรม บริษัทเดินรถ ผู้จัดกิจกรรม และสายการบิน เพื่อลดต้นทุนทัวร์ระยะยาว</p></div>${Object.entries(PARTNERS).map(([id,x])=>{const lvl=s.partners[id],nextCost=Math.round(x.base*(lvl+1)*(1+lvl*.25));const req=s.registered&&(id!=='airline'||s.international);return `<div class="card"><div class="split"><div><div class="itemtitle">${x.emoji} ${x.name}</div><div class="itemsub">${E(x.benefit)}</div></div>${badge('ระดับ '+lvl+'/3',lvl?'ok':'')}</div><div class="progress" style="margin:10px 0 12px"><i style="width:${pct(lvl/3*100)}"></i></div>${lvl<3?`<button class="btn sec full" data-act="partner" data-id="${id}" ${!req||s.cash<nextCost?'disabled':''}>${lvl?'ต่อสัญญาขั้น '+(lvl+1):'ทำข้อตกลงใหม่'} • ${baht(nextCost)}</button>`:badge('พันธมิตรระดับสูงสุด','ok')}${!req?`<div class="hint">🔒 ${id==='airline'?'ต้องปลดล็อกทัวร์ต่างประเทศก่อน':'ต้องตั้งบริษัทในเกมก่อน'}</div>`:''}</div>`}).join('')}`;}
return `<div class="card hero"><div class="eyebrow">YOUR BUSINESS</div><div class="title">🏢 บริหารบริษัทและทีม</div><p class="subtitle">จดทะเบียนในเกม จ้างพนักงาน เพิ่มออฟฟิศ และต่อรองคู่ค้า เพื่อขยายธุรกิจของคุณ</p></div><div class="subtabs" role="tablist">${sub.map(([id,label])=>`<button role="tab" aria-selected="${opsTab===id}" class="${opsTab===id?'active':''}" data-act="opstab" data-id="${id}">${label}</button>`).join('')}</div>${body}`;}

ong>ลูกค้า ${num(v.count)} คน • รายได้ ${baht(v.revenue)} • <span class="${v.profit<0?'negative':'positive'}">${baht(v.profit)}</span></div>`).join(''):`<div class="empty">ยังไม่มีรายงาน</div>`}</div><div class="section">📰 บันทึกเหตุการณ์</div><div class="card">${s.logs.slice(0,14).map(l=>`<div class="feeditem"><strong>สัปดาห์ ${num(l.week)} — ${E(l.title)}</strong>${E(l.description)}</div>`).join('')}</div>`;}

function modalHTML(){if(!modal)return '';let content='';if(modal.type==='scenario'){const sc=SCENARIOS[s.pending];if(!sc){modal=null;return ''}content=`<div class="eyebrow">เหตุการณ์พิเศษ</div><h2>${sc.emoji} ${E(sc.title)}</h2><p>${E(sc.text)}</p><div class="actions">${sc.options.map((o,i)=>`<button class="btn ${i?'sec':'green'} full" data-act="scenario" data-value="${i}">${E(o.name)}</button>`).join('')}</div>`;}
else if(modal.type==='confirm'){content=`<div class="eyebrow">ยืนยันการดำเนินการ</div><h2>${E(modal.title)}</h2><p>${E(modal.message)}</p><div class="grid2"><button class="btn sec full" data-act="close">ยกเลิก</button><button class="btn danger full" data-act="confirm" data-id="${E(modal.confirm)}" data-value="${E(modal.value||'')}">ยืนยัน</button></div>`;}
else if(modal.type==='guide'){content=`<div class="eyebrow">QUICK START GUIDE</div><h2>🧭 เริ่มเล่นใน 3 ขั้นตอน</h2><p>เริ่มที่หน้าภาพรวม: ทำงานสั้น → เดินทาง → ถ่ายภาพหรือวิดีโอ → ตัดต่อและเผยแพร่ในหน้าครีเอเตอร์ แต่ละรอบมี 4 แต้มทำงาน เติมใหม่เมื่อจบสัปดาห์ ไม่ต้องรอเวลาจริง เกมนี้ใช้เวลา 1 สัปดาห์ต่อการกดจำลอง 1 ครั้ง คุณต้องตัดสินใจแล้วดูว่าแผนธุรกิจทำกำไรหรือไม่</p><div class="step done"><div class="stepicon">1</div><div class="stepmain"><strong>🧳 จัดทัวร์</strong><span>เลือกเส้นทาง ที่พัก รถ กิจกรรม และตั้งราคาที่เหมาะสม</span></div></div><div class="step done"><div class="stepicon">2</div><div class="stepmain"><strong>📣 ลงโฆษณา</strong><span>เลือกกลุ่มลูกค้าและงบโฆษณาเพื่อเพิ่มยอดจอง</span></div></div><div class="step done"><div class="stepicon">3</div><div class="stepmain"><strong>▶ กดจำลอง 1 สัปดาห์</strong><span>ระบบจะคำนวณลูกค้า รายรับ ต้นทุน กำไร และเหตุการณ์สุ่ม</span></div></div><p>เมื่อมีเงิน 30,000 ฿ ชื่อเสียง 20 และลูกค้า 25 คน จะปลดล็อกการเปิดบริษัทในเกม จากนั้นจ้างพนักงานและสร้างทัวร์ของตัวเองได้</p><div class="note">💾 ถ้าเคยเล่น v1 บนเว็บไซต์เดิม ระบบจะพยายามย้ายเซฟเดิมมาให้โดยอัตโนมัติ</div><button class="btn green full" style="margin-top:12px" data-act="close">เริ่มบริหารธุรกิจ!</button>`;}
else{content=`<div class="eyebrow">TOUR EMPIRE 3.0</div><h2>${E(modal.title)}</h2><p>${E(modal.message)}</p>${modal.details?`<div class="note ${modal.positive?'ok':'warn'}" style="margin:10px 0">${E(modal.details)}</div>`:''}<button class="btn green full" style="margin-top:10px" data-act="close">รับทราบ</button>`;}

function render(){const root=document.getElementById('app');if(!root)return;root.innerHTML=header()+`<main class="container">${views[tab]()}</main>`+nav()+modalHTML();}
function alertGame(title,message,details='',positive=false){modal={type:'info',title,message,details,positive};render()}
function transact(cost,cb,title,detail){if(s.cash<cost){alertGame('เงินสดไม่เพียงพอ','ต้องมีเงินอย่างน้อย '+baht(cost)+'\nเงินสดตอนนี้ '+baht(s.cash));return false} s.cash-=cost;cb();addLog(title,detail);const unlocks=checkAchievements();persist();alertGame('🎉 '+title,detail,unlocks.length?'ปลดล็อกรางวัล: '+unlocks.join(', '):'');return true}
function advanceWeek(){if(s.pending){modal={type:'scenario'};render();return}const r=route(),m=costOf(),market=s.market;const weekNum=s.week;const events=[{title:'อากาศดี คนอยากเที่ยว',book:2,rep:1},{title:'ฝนตก ลูกค้าบางส่วนเลื่อนทริป',book:-2,rep:0},{title:'รีวิวบนโซเชียลไวรัล',book:3,rep:1},{title:'คู่แข่งจัดโปรโมชั่น',book:-2,rep:0},{title:'เข้าสู่ฤดูกาลท่องเที่ยว',book:2,rep:0},{title:'สัปดาห์ตลาดชะลอ',book:-1,rep:0},{title:'การเดินทางราบรื่น',book:0,rep:1},{title:'โรงแรมและสถานที่คนสนใจมาก',book:1,rep:0},{title:'มีวันหยุดยาว',book:3,rep:0}];const ev=events[Math.floor(Math.random()*events.length)];const swing=Math.floor(Math.random()*5)-2;const count=clamp(Math.round(m.expected+ev.book+swing),0,m.seatLimit);const revenue=m.revAt(count);let cost=m.costAt(count)+businessFee(m.revAt(count)-m.costAt(count)),disruption=0;const disruptionChance= s.registered?Math.max(.03,.13-s.staff.ops*.02-s.training.ops*.01):.02;
 if(count>0&&Math.random()<disruptionChance){disruption=Math.round((m.fixed*.10)+(count*m.variable*.045));cost+=disruption;}
 const profit=revenue-cost;const quality=clamp(m.q+Math.round(Math.random()*8-4)-(disruption?8:0),20,100);let repDiff=count===0?-1:quality>=82?4:quality>=69?2:quality>=55?1:-2;repDiff+=ev.rep;repDiff+=market.channel==='creator'&&count>0?1:0;repDiff=clamp(repDiff,-5,7);
 s.cash+=profit;s.reputation=clamp(s.reputation+repDiff,0,100);s.customers+=count;s.revenueTotal+=revenue;s.profitTotal+=profit;s.spentTotal+=cost;
 if(s.registered&&count>0)s.toursDone++;if(s.loan){s.loan.weeksLeft--;if(s.loan.weeksLeft<=0){s.loan=null;addLog('✅ ชำระเงินกู้หมดแล้ว','ครบกำหนดชำระคืนสินเชื่อธุรกิจ')}}
 const record={week:weekNum,route:r.name,routeId:r.id,count,revenue,cost,profit,quality,repDiff,event:ev.title+(disruption?' • ค่าใช้จ่ายฉุกเฉิน '+baht(disruption):'')};s.records.push(record);s.records=s.records.slice(-150);s.last=record;addLog(profit>=0?'📈 สัปดาห์นี้มีกำไร':'📉 สัปดาห์นี้ขาดทุน',`${r.name} ลูกค้า ${count} คน • รายรับ ${baht(revenue)} • ค่าใช้จ่าย ${baht(cost)} • กำไร ${baht(profit)}`);
 finishCreatorWeek(r,count);s.week++;s.competitor=clamp(.86+Math.random()*.27,.74,1.28);s.marketPulse=clamp(Math.floor(Math.random()*5)-2,-3,3);s.news=ev.title;
 const unlocked=checkAchievements();if(Math.random()<(s.registered?.33:.20))s.pending=Object.keys(SCENARIOS)[Math.floor(Math.random()*Object.keys(SCENARIOS).length)];persist();tab='home';window.scrollTo(0,0);
 let detail=(unlocked.length?'🏆 รางวัลใหม่: '+unlocked.join(', ')+'\n':'')+(s.pending?'⚠️ มีเหตุการณ์พิเศษรอการตัดสินใจที่หน้าภาพรวม':'');alertGame(profit>=0?'📈 สัปดาห์นี้ทำกำไร!':'📉 สัปดาห์นี้ขาดทุน',`${ev.title}\n\nลูกค้าจอง ${num(count)} คน\nรายได้ ${baht(revenue)}\nค่าใช้จ่าย ${baht(cost)}\nกำไรสุทธิ ${profit>=0?'+':''}${baht(profit)}\nชื่อเสียง ${repDiff>=0?'+':''}${repDiff} → ${s.reputation}/100\nเงินสดคงเหลือ ${baht(s.cash)}`,detail,profit>=0);}
function creatorFans(){return s.creator.channels.tiktok.fans+s.creator.channels.youtube.fans}
function creatorEarn(amount,label){s.cash+=amount;s.revenueTotal+=amount;s.profitTotal+=amount;s.creator.income+=amount;addLog(label,baht(amount));}
function creatorSpendAP(xp){if(s.creator.ap<1){alertGame('ใช้แต้มงานครบแล้ว','กดจบสัปดาห์เพื่อเดินทางและรับ 4 แต้มใหม่ทันที ไม่มีเวลารอ');return false}s.creator.ap--;s.creator.xp+=xp;return true}
function finishCreatorWeek(r,count){const c=s.creator;if(count>0){c.xp+=2;if(!c.visited.includes(r.id)){c.visited.push(r.id);c.xp+=6}c.stock.push({route:r.id,week:s.week,photo:false,video:false});c.stock=c.stock.slice(-(8+c.gear.bag*4))}c.ap=4;c.jobs=[];c.boost=0;}
function chapterReady(g){const c=s.creator;return c.xp>=g.xp&&(g.xp<480||c.visited.some(id=>ROUTES.find(r=>r.id===id)?.area==='abroad'))&&(g.xp<1500||(c.posts>=50&&c.visited.length>=12&&creatorFans()>=10000));}

function quickJobs(){const c=s.creator;return `<div class="pills" style="margin-top:10px">${[['clients','💬 คุยลูกค้า','ยอดจองรอบนี้ +1'],['research','🗺️ หามุมเที่ยว','+4 XP'],['freelance','✍️ รับเขียนรีวิว',baht(700+Math.min(2300,Math.floor(c.xp/2)))]].map(([id,name,detail])=>`<button class="btn sec" data-act="job" data-id="${id}" ${!c.ap||c.jobs.includes(id)?'disabled':''}>${name}<br>${detail} · 1 แต้ม</button>`).join('')}</div>`;}
function creatorView(){const c=s.creator;return `<div class="card creator-hero"><div class="eyebrow">TRAVEL • SHOOT • SHARE</div><h2>📷 ชีวิตครีเอเตอร์ของคุณ</h2><p class="subtitle">ช่องและรายได้เป็นระบบจำลองในเกม ภาพ/วิดีโอเป็นไอเท็มคอนเทนต์ ไม่เชื่อมบัญชีจริง</p><div class="spread" style="margin-top:15px"><span>⚡ ${c.ap}/4 แต้ม</span><span>✨ ${num(c.xp)} XP</span><span>👥 ${num(creatorFans())}</span></div></div><div class="creator-tabs"><a class="btn sec sm" href="#channels">ช่องของฉัน</a><a class="btn sec sm" href="#studio">ถ่าย / ตัดต่อ</a><a class="btn sec sm" href="#gear">ร้านอุปกรณ์</a><a class="btn sec sm" href="#journey">เป้าหมาย</a></div><div class="card">${quickJobs()}</div>

<div class="card"><div class="itemtitle">🎯 โจทย์สัปดาห์นี้: ${s.week%2?'วิดีโอตัดต่อลง YouTube':'ภาพถ่ายตัดต่อลง TikTok'}</div><p class="itemsub">ตรงโจทย์รับเพิ่ม 750 ฿ ครั้งเดียวต่อสัปดาห์ • เลือกทำได้ ไม่เสียโบนัสอื่น</p></div><div class="section" id="studio">🎬 สตูดิโอ <small>${c.stock.length}/${8+c.gear.bag*4} วัตถุดิบ</small></div><div class="note">จบทัวร์ที่มีลูกค้าเพื่อเก็บวัตถุดิบจากสถานที่นั้น → ถ่าย (1 แต้ม) → ตัดต่อได้ 1 ครั้ง (1 แต้ม) → เผยแพร่ (1 แต้ม) • ทุกช่วงได้ 2 XP<br>เทรนด์รอบนี้: <b>${['ธรรมชาติ','วัฒนธรรม','ทะเล','ผจญภัย'][Math.floor((s.week-1)/3)%4]}</b> • เทรนด์ตรง +25% วิว • ต่างประเทศ +35% วิว</div>
${c.drafts.length?`<div class="section">พร้อมตัดต่อ / เผยแพร่ <small>${c.drafts.length}/12 ชิ้น</small></div>`:''}${c.drafts.map((d,i)=>{const r=ROUTES.find(r=>r.id===d.route);return `<div class="card creator-card"><div class="itemtitle">${d.kind==='photo'?'📸 ภาพถ่าย':'🎞️ วิดีโอ'} ${E(r.name)}</div><div class="itemsub">คุณภาพ ${d.q}/100 · ${d.edited?'ตัดต่อแล้ว':'ฉบับดิบ'}${r.area==='abroad'?' · คอนเทนต์ต่างประเทศ':''}</div><div class="pills" style="margin-top:10px"><button class="btn sec" data-act="editContent" data-id="${i}" ${!c.ap||d.edited?'disabled':''}>ตัดต่อ +${12+c.gear.laptop*6} คุณภาพ</button>${['tiktok','youtube'].map(p=>`<button class="btn green" data-act="publish" data-id="${i}" data-value="${p}" ${!c.ap||!c.channels[p].open||(p==='youtube'&&d.kind!=='video')?'disabled':''}>ลง ${p==='tiktok'?'TikTok':'YouTube'}</button>`).join('')}<button class="btn light" data-act="discard" data-id="${i}">ทิ้งฉบับนี้</button></div><div class="hint">โพสต์หนึ่งชิ้นลงได้หนึ่งช่อง • ภาพ TikTok ขายสิทธิ์ภาพจำลองเพิ่มตามระดับกล้อง</div></div>`}).join('')}
${!c.stock.length?'<div class="card empty">ยังไม่มีวัตถุดิบ กดจบสัปดาห์เพื่อออกทัวร์แรก แล้วกลับมาถ่ายที่นี่</div>':c.stock.map((v,i)=>{const r=ROUTES.find(r=>r.id===v.route);return `<div class="card"><div class="split"><div><div class="itemtitle">${r.emoji} ${E(r.name)}</div><div class="itemsub">ทัวร์สัปดาห์ ${v.week} · ${r.area==='abroad'?'ต่างประเทศ':'ในประเทศ'}</div></div>${badge(v.photo&&v.video?'ถ่ายครบแล้ว':'พร้อมถ่าย','ok')}</div><div class="pills" style="margin-top:10px">${['photo','video'].map(k=>`<button class="btn sec" data-act="capture" data-id="${i}" data-value="${k}" ${!c.ap||v[k]||c.drafts.length>=12?'disabled':''}>${k==='photo'?'📸 ถ่ายภาพ':'🎥 ถ่ายวิดีโอ'} · 1 แต้ม</button>`).join('')}</div></div>`}).reverse().join('')}
<div class="section" id="gear">🛍️ ร้านของใช้ครีเอเตอร์</div><div class="creator-grid">${Object.entries(GEAR).map(([id,g])=>{const lv=c.gear[id],next=lv+1,full=next>=g.levels.length;return `<div class="card"><div class="itemtitle">${g.icon} ${g.name}</div><p class="itemsub">ใช้อยู่: ${g.levels[lv]}<br>${g.bonus}</p>${full?badge('ครบระดับแล้ว','ok'):`<div class="itemtitle">${g.levels[next]}</div><p class="itemsub">${baht(g.cost[next])} · ต้องมี ${g.xp[next]} XP</p><button class="btn ${s.cash-g.cost[next]<costOf().wageTotal?'sec':'green'} full" data-act="gear" data-id="${id}" ${s.cash<g.cost[next]||c.xp<g.xp[next]?'disabled':''}>ซื้อและสวมใส่</button><div class="hint">เหลือเงิน ${baht(s.cash-g.cost[next])}</div>`}</div>`}).join('')}</div>
<div class="section" id="journey">🏆 เส้นทาง 5 บท</div><div class="card"><p class="itemsub">ออกแบบสำหรับประมาณ 120 รอบ รอบละ 1.5–2 นาที (เป้าหมาย 3–4 ชั่วโมง ขึ้นอยู่กับวิธีเล่น) ไม่มีการล็อกด้วยเวลาจริง</p>${CHAPTERS.map(g=>`<div class="creator-goal"><div><div class="itemtitle">${g.name}</div><div class="itemsub">${g.xp} XP · รางวัล ${baht(g.cash)}${g.xp>=480?'<br>เคยเดินทางต่างประเทศ':''}${g.xp===1500?'<br>50 โพสต์ · 12 เส้นทาง · 10,000 ผู้ติดตาม':''}</div></div><button class="btn ${chapterReady(g)?'gold':'light'}" data-act="chapter" data-id="${g.xp}" ${!chapterReady(g)||c.claimed.includes(g.xp)?'disabled':''}>${c.claimed.includes(g.xp)?'รับแล้ว':'รับรางวัล'}</button></div>`).join('')}<div class="note">ต่างประเทศ: เปิดบริษัท + จัดทัวร์ 8 ครั้ง + เงิน 85,000 ฿ + 220 XP แล้วซื้อสิทธิ์ที่เมนูบริษัท</div><p class="hint">สะสมแล้ว ${c.visited.length}/12 เส้นทาง · ${c.posts}/50 โพสต์ · ${num(creatorFans())}/10,000 ผู้ติดตาม</p></div><div class="section">🗺️ สมุดเดินทาง</div><div class="card pills">${c.visited.map(id=>{const r=ROUTES.find(r=>r.id===id);return badge(r.emoji+' '+r.name,'ok')}).join('')||'ออกทัวร์แรกเพื่อเริ่มสะสม'}</div><div class="section">📈 ผลงานล่าสุด</div><div class="card creator-feed">${c.feed.map(x=>`<div class="feeditem">${E(x)}</div>`).join('')||'<p class="itemsub">เผยแพร่ชิ้นแรกเพื่อดูวิว ผู้ติดตาม และรายได้</p>'}</div>`;}
function creatorAction(a,id,v){const c=s.creator;
 if(a==='job'){if(!['clients','research','freelance'].includes(id)||c.jobs.includes(id))return true;if(!creatorSpendAP(id==='research'?4:2))return true;c.jobs.push(id);if(id==='clients')c.boost=1;if(id==='freelance')creatorEarn(700+Math.min(2300,Math.floor(c.xp/2)),'รับงานเขียนรีวิว');}
 else if(a==='channel'){if(!['tiktok','youtube'].includes(id)||c.channels[id].open)return true;if(!creatorSpendAP(2))return true;c.channels[id].open=true;}
 else if(a==='capture'){const stock=c.stock[Number(id)];if(!stock||!['photo','video'].includes(v)||stock[v]||c.drafts.length>=12)return true;if(!creatorSpendAP(2))return true;stock[v]=true;const q=Math.min(90,35+c.gear.phone*7+c.gear.tripod*4+(v==='photo'?c.gear.camera*10:c.gear.video*9+c.gear.mic*5));c.drafts.push({route:stock.route,kind:v,q,edited:false});}
 else if(a==='editContent'){const d=c.drafts[Number(id)];if(!d||d.edited)return true;if(!creatorSpendAP(2))return true;d.q=Math.min(100,d.q+12+c.gear.laptop*6);d.edited=true;}
 else if(a==='discard'){if(!/^\d+$/.test(id)||!c.drafts[Number(id)])return true;c.drafts.splice(Number(id),1);}
 else if(a==='publish'){const i=Number(id),d=c.drafts[i],ch=c.channels[v];if(!d||!ch?.open||(v==='youtube'&&d.kind!=='video'))return true;if(!creatorSpendAP(2))return true;const r=ROUTES.find(r=>r.id===d.route),trend=['ธรรมชาติ','วัฒนธรรม','ทะเล','ผจญภัย'][Math.floor((s.week-1)/3)%4];const views=Math.round((400+d.q*32+Math.sqrt(ch.fans)*16)*(r.area==='abroad'?1.35:1)*(trend===r.type?1.25:1)*(v==='tiktok'?1.3:1)*(0.9+Math.random()*.2));const fans=Math.round(views*(v==='tiktok'?.025:.018));const brief=!c.jobs.includes('brief')&&d.edited&&(s.week%2?(v==='youtube'&&d.kind==='video'):(v==='tiktok'&&d.kind==='photo'));if(brief)c.jobs.push('brief');const money=(brief?750:0)+Math.round(views*(v==='youtube'?.15:.045)+(d.kind==='photo'?100+c.gear.camera*100:0));ch.fans+=fans;ch.views+=views;ch.posts++;c.posts++;creatorEarn(money,'รายได้คอนเทนต์ '+v);c.drafts.splice(i,1);const result=`${ch.name} · ${r.name} · ${num(views)} วิว · +${num(fans)} ผู้ติดตาม · +${baht(money)}`;c.feed.unshift(result);c.feed=c.feed.slice(0,12);persist();alertGame('เผยแพร่ผลงานแล้ว!',result,'ผู้ติดตามส่งผลต่อยอดจองทัวร์ สูงสุด +2 คน',true);return true;}
 else if(a==='gear'){const g=GEAR[id];if(!g)return true;const lv=c.gear[id]+1;if(lv>=g.levels.length||c.xp<g.xp[lv])return true;transact(g.cost[lv],()=>c.gear[id]=lv,'ซื้อ '+g.levels[lv],g.bonus);return true;}
 else if(a==='chapter'){const g=CHAPTERS.find(x=>x.xp===Number(id));if(!g||!chapterReady(g)||c.claimed.includes(g.xp))return true;c.claimed.push(g.xp);creatorEarn(g.cash,'รางวัลบท '+g.name);if(g.xp===1500)c.completed=true;persist();alertGame(c.completed?'🌟 สร้างอาณาจักรสำเร็จ!':'🏆 ผ่านเป้าหมายใหม่',g.name+'\nรับ '+baht(g.cash),c.completed?'เล่นต่อได้อิสระ: สะสมประเทศ อัปเกรดอุปกรณ์ และขยายช่อง':'เลือกเป้าหมายถัดไปในหน้าครีเอเตอร์',true);return true;}
 else if(a==='autoPlan'){const r=route();s.market.budget=0;s.market.offer='none';s.market.audience='all';s.plans[r.id]=planDefault(r);let best=-Infinity,bp=r.basePrice;for(const mul of [.85,.95,1,1.1,1.2,1.3]){plan().price=Math.round(r.basePrice*mul);const m=costOf(),profit=m.profitAt(m.bookings);if(profit>best){best=profit;bp=plan().price}}plan().price=bp;persist();alertGame('🧭 จัดแผนแนะนำแล้ว','เลือกบริการมาตรฐาน งบโฆษณา 0 ฿ และเปรียบเทียบราคาให้แล้ว\nกำไรคาดการณ์ '+baht(best),'เป็นการประมาณ ผลจริงเปลี่ยนตามยอดจองและเหตุการณ์');return true;}
 else return false;persist();render();return true;
}

function scenarioChoice(index){const sc=SCENARIOS[s.pending];if(!sc){modal=null;render();return}const opt=sc.options[index];if(!opt)return;if(opt.cash<0&&s.cash<-opt.cash){alertGame('เงินไม่พอ','เลือกวิธีตอบกลับฟรีได้ที่เหตุการณ์เดิม');return}if(opt.cash>0)s.cash+=opt.cash;else if(opt.cash<0)s.cash+=opt.cash;s.reputation=clamp(s.reputation+opt.rep,0,100);addLog(sc.title,opt.name);s.pending=null;checkAchievements();persist();alertGame('✅ ตัดสินใจเรียบร้อย',opt.name+'\nเงินสดตอนนี้ '+baht(s.cash)+'\nชื่อเสียง '+s.reputation+'/100');}
function confirmReset(){s=sanitize(initial());migrated=false;persist();tab='home';opsTab='office';finTab='report';routeFilter='all';showAllRoutes=false;modal=null;render();window.scrollTo(0,0);}
function takeLoan(amount){if(s.loan){alertGame('กู้ใหม่ไม่ได้','ต้องชำระสินเชื่อเดิมให้ครบก่อน');return}const opts={15000:{weeks:10,total:18000,ok:true},60000:{weeks:12,total:72000,ok:s.registered},180000:{weeks:15,total:225000,ok:s.international}};const o=opts[amount];if(!o||!o.ok)return;s.loan={amount,payment:o.total/o.weeks,weeksLeft:o.weeks};s.cash+=amount;addLog('🏦 รับเงินทุน',`ได้รับเงินกู้ ${baht(amount)} ผ่อน ${o.weeks} สัปดาห์`);persist();alertGame('💳 เงินกู้ได้รับอนุมัติในเกม','เงินเข้าบริษัท '+baht(amount)+'\nผ่อน '+baht(s.loan.payment)+' / สัปดาห์ จำนวน '+o.weeks+' สัปดาห์');}
function exportSave(){persist();try{const data=JSON.stringify({game:'TOUR_EMPIRE',saveVersion:2,exportedAt:new Date().toISOString(),state:s},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tour-empire-save-week-'+s.week+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);alertGame('✅ เตรียมดาวน์โหลดเซฟแล้ว','เลือกบันทึกไฟล์ JSON ลงแอปไฟล์บนมือถือ เพื่อใช้สำรองหรือย้ายเครื่องได้');}catch(e){alertGame('ไม่สามารถสำรองเซฟ','เบราว์เซอร์นี้ไม่รองรับการดาวน์โหลดไฟล์ กรุณาเปิดเว็บใน Safari หรือ Chrome');}}
function loadBackup(file){if(!file)return;if(file.size>1000000){alertGame('ไฟล์ใหญ่เกินไป','กรุณาเลือกไฟล์เซฟ TOUR EMPIRE ขนาดไม่เกิน 1 MB');return}const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);let loaded;if(d.game==='TOUR_EMPIRE'&&d.state)loaded=d.state;else if(d&&d.version===2)loaded=d;else if(d&&d.week&&Array.isArray(d.unlocked)&&Array.isArray(d.logs))loaded=migrate(d);else throw Error('not compatible');const normalized=sanitize(loaded);s=normalized;persist();modal=null;tab='home';window.scrollTo(0,0);alertGame('✅ นำเข้าเซฟสำเร็จ','โหลดข้อมูลสัปดาห์ '+s.week+'\nเงินสด '+baht(s.cash)+'\nบริษัท '+s.company)}catch(e){alertGame('❌ เปิดเซฟไม่ได้','ไฟล์ที่เลือกไม่ใช่ JSON เซฟ TOUR EMPIRE ที่รองรับ หรือไฟล์อาจเสียหาย')}};reader.onerror=()=>alertGame('อ่านไฟล์ไม่ได้','ลองเลือกไฟล์ JSON อีกครั้ง');reader.readAsText(file);}
function click(e){const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,v=el.dataset.value,k=el.dataset.key;if(creatorAction(a,id,v))return;if(a==='mapmode'){mapMode=id;mapSel=null;render();return}if(a==='mapzoom'){mapZoom=!mapZoom;render();return}if(a==='mapreg'){mapReg=id;render();return}if(a==='mapsel'){mapSel=id;render();return}
 if(a==='nav'){modal=null;tab=views[id]?id:'home';render();window.scrollTo(0,0);return}
 if(a==='opstab'){opsTab=id;render();return}
 if(a==='fintab'){finTab=id;render();return}
 if(a==='close'){modal=null;render();return}
 if(a==='guide'){modal={type:'guide'};render();return}
 if(a==='advance'){advanceWeek();return}
 if(a==='scenarioOpen'){modal={type:'scenario'};render();return}
 if(a==='scenario'){scenarioChoice(int(v));return}
 if(a==='routefilter'){routeFilter=id;showAllRoutes=false;render();return}
 if(a==='showroutes'){showAllRoutes=!showAllRoutes;render();return}
 if(a==='route'){if(!s.unlocked.includes(id))return;s.selected=id;persist();render();return}
 if(a==='unlock'){const x=ROUTES.find(r=>r.id===id);if(!x||s.unlocked.includes(id)||!canRoute(x))return;transact(x.unlock,()=>{s.unlocked.push(id);s.selected=id},'เปิดเส้นทาง '+x.name,'จ่ายค่าขยายเส้นทาง '+baht(x.unlock));return}
 if(a==='setplan'){const p=plan();if(!['hotel','transport','meals'].includes(k))return;if((k==='hotel'&&!HOTELS[v])||(k==='transport'&&!TRANSPORT[v])||(k==='meals'&&!MEALS[v]))return;p[k]=v;persist();render();return}
 if(a==='setseats'){if(![8,12,16,20,24].includes(int(v)))return;plan().seats=int(v);persist();render();return}
 if(a==='stop'){const p=plan(),d=int(el.dataset.day),n=int(id);if(!(d>=1&&d<=route().days&&n>=0&&n<6))return;const list=p.activities[d];if(list.includes(n))p.activities[d]=list.filter(x=>x!==n);else if(list.length<2)list.push(n);persist();render();return}
 if(a==='priceStep'){plan().price=clamp(plan().price+int(v),Math.round(route().basePrice*.65),Math.round(route().basePrice*1.5));persist();render();return}
 if(a==='setmarket'){if(k==='budget'){if(![0,500,1000,2000,4000,8000,15000].includes(int(v)))return;s.market.budget=int(v)}else if(k==='channel'&&MKT[v])s.market.channel=v;else if(k==='offer'&&OFFER[v])s.market.offer=v;else if(k==='audience'&&AUD[v])s.market.audience=v;else return;persist();render();return}
 if(a==='register'){if(s.registered||s.cash<30000||s.reputation<20||s.customers<25)return;transact(12000,()=>{s.registered=true},'เปิดบริษัททัวร์สำเร็จ','คุณเปิดบริษัทในเกมแล้ว สามารถจัดทัวร์เองและขยายเส้นทางในประเทศได้');return}
 if(a==='international'){if(!s.registered||s.international||s.cash<85000||s.toursDone<8||s.creator.xp<220){alertGame('เป้าหมายต่างประเทศ','ต้องเปิดบริษัท มีเงิน 85,000 ฿ จัดทัวร์ 8 ครั้ง และประสบการณ์ 220 XP');return}transact(35000,()=>{s.international=true},'เปิดทัวร์ต่างประเทศ','คุณสามารถปลดล็อกเส้นทางต่างประเทศและต่อรองกับสายการบินได้');return}
 if(a==='branch'){const b=BRANCHES[id];if(!b||s.branches.includes(id)||!s.registered||(id==='abroad'&&!s.international))return;transact(b.cost,()=>s.branches.push(id),'เปิด'+b.name,b.benefit+' • ค่าใช้จ่ายเพิ่ม '+baht(b.weekly)+'/สัปดาห์');return}
 if(a==='office'){const cost=[9500,22000,48000,110000][s.office];if(!s.registered||s.office>=4)return;transact(cost,()=>s.office++,'ขยายสำนักงาน','อัปเกรดสำนักงานเป็น LV.'+(s.office+1)+' เพื่อเพิ่มจำนวนพนักงานที่รับได้');return}
 if(a==='hire'){const role=STAFF[id],staffCount=Object.values(s.staff).reduce((t,n)=>t+n,0);if(!role||!s.registered||staffCount>=2+s.office*4||s.staff[id]>=6)return;transact(role.cost,()=>s.staff[id]++,'จ้าง'+role.name,'พนักงานเพิ่ม 1 คน • เงินเดือนรายสัปดาห์ '+baht(role.salary));return}
 if(a==='train'){const role=STAFF[id];if(!role||s.staff[id]<1||s.training[id]>=3)return;const cost=2500+s.training[id]*2200;transact(cost,()=>s.training[id]++,'ฝึกอบรม'+role.name,role.name+' ได้รับการฝึกเพิ่มเป็น LV.'+(s.training[id]+1));return}
 if(a==='fire'){if(!STAFF[id]||s.staff[id]<1)return;modal={type:'confirm',title:'ปลดพนักงาน 1 คน?',message:'ปลด '+STAFF[id].name+' จะลดค่าเงินเดือนรายสัปดาห์และลดความสามารถของบริษัท',confirm:'fire',value:id};render();return}
 if(a==='partner'){const partner=PARTNERS[id];if(!partner||!s.registered||(id==='airline'&&!s.international)||s.partners[id]>=3)return;const level=s.partners[id],cost=Math.round(partner.base*(level+1)*(1+level*.25));transact(cost,()=>s.partners[id]++,'เซ็นสัญญา'+partner.name,partner.benefit+' • ระดับใหม่ '+(level+1));return}
 if(a==='loan'){takeLoan(int(v));return}
 if(a==='repayloan'){if(!s.loan)return;const pay=s.loan.payment*s.loan.weeksLeft;if(s.cash<pay)return;modal={type:'confirm',title:'ชำระเงินกู้ทั้งหมด?',message:'จะหักเงินสด '+baht(pay)+' เพื่อปิดยอดค้างทั้งหมด',confirm:'repayloan'};render();return}
 if(a==='export'){exportSave();return}
 if(a==='import'){document.getElementById('backupInput').click();return}
 if(a==='reset'){modal={type:'confirm',title:'ต้องการเริ่มเกมใหม่?',message:'ความคืบหน้าทั้งหมดของ TOUR EMPIRE เวอร์ชัน 2 จะถูกแทนที่ แนะนำให้สำรองเซฟก่อน',confirm:'reset'};render();return}
 if(a==='confirm'){if(id==='reset'){confirmReset();return}if(id==='fire'&&STAFF[v]&&s.staff[v]>0){s.staff[v]--;addLog('ลดทีมงาน','ปลดพนักงาน '+STAFF[v].name+' 1 คน');persist();modal=null;render();return}if(id==='repayloan'&&s.loan){const cost=s.loan.payment*s.loan.weeksLeft;if(s.cash>=cost){s.cash-=cost;s.loan=null;addLog('ชำระสินเชื่อหมดแล้ว','ปิดยอดเงินกู้ '+baht(cost));persist();alertGame('✅ ปิดยอดหนี้สำเร็จ','บริษัทไม่มีภาระผ่อนเงินกู้นี้แล้ว')}return}return}
}
function change(e){const target=e.target.closest('[data-change]');if(!target)return;const kind=target.dataset.change;if(kind==='channelName'){if(['tiktok','youtube'].includes(target.dataset.id)){s.creator.channels[target.dataset.id].name=String(target.value).trim().slice(0,32)||'Travel Diary';persist();render()}return}if(kind==='price'){plan().price=clamp(int(target.value)||route().basePrice,Math.round(route().basePrice*.65),Math.round(route().basePrice*1.5))}else if(kind==='company'){s.company=String(target.value).trim().slice(0,40)||'My Travel Agency'}else return;persist();render();}
document.addEventListener('click',click);document.addEventListener('change',change);document.getElementById('backupInput').addEventListener('change',function(){const f=this.files&&this.files[0];this.value='';loadBackup(f)});
window.addEventListener('error',e=>{const fatal=document.getElementById('fatal');if(fatal)fatal.innerHTML='<div class="overlay-error"><strong>เกิดปัญหาในการโหลดเกม</strong><p>ลองรีเฟรช Safari หรือ Chrome หากไม่หาย ให้ส่งภาพหน้าจอข้อผิดพลาดกลับมาเพื่อแก้ไข</p></div>';});
persist();render();
window.__TOUR_EMPIRE_TEST__={getState:()=>JSON.parse(JSON.stringify(s)),getCost:()=>costOf(),creatorAction,finishCreatorWeek,cleanCreator,ROUTES,next:advanceWeek,setState:test=>{s=sanitize(test);persist();render()},go:t=>{tab=t;render()}};
})();
</script>
